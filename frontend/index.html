<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servora — Premium Multi-Service Booking Marketplace</title>
  <meta name="description" content="Servora connects customers with trusted, verified local service professionals with instant booking, live tracking, and secure payments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="./dist/output.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <!-- Chart.js for Dashboards -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Navbar -->
  <header id="navbar-container" class="sticky top-0 z-40 w-full"></header>

  <!-- Main View Container -->
  <main id="app" class="flex-grow w-full flex flex-col overflow-x-hidden"></main>

  <!-- Footer -->
  <footer id="footer-container" class="w-full mt-auto"></footer>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>

  <!-- Main Application Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
