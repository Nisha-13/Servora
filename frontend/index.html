<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servora — Premium Multi-Service Booking Marketplace</title>
  <meta name="description" content="Servora connects customers with trusted, verified local service professionals with instant booking, live tracking, and secure payments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="./dist/output.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <!-- Chart.js for Dashboards -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Quick Demo Switcher Bar -->
  <div id="demo-bar" class="bg-slate-900 border-b border-slate-800 text-xs py-1.5 px-4 flex flex-wrap items-center justify-between gap-2 z-50">
    <div class="flex items-center space-x-2 text-slate-400">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span class="font-semibold text-slate-300">Live Demo Mode:</span>
      <span>Click any profile to instantly authenticate & test workflows:</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="window.quickLogin('CUSTOMER')" class="px-2.5 py-1 rounded bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 border border-blue-500/30 font-medium transition">
        👤 Customer (Usman)
      </button>
      <button onclick="window.quickLogin('PROVIDER')" class="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 border border-emerald-500/30 font-medium transition">
        🛠️ Provider (Ahmed)
      </button>
      <button onclick="window.quickLogin('ADMIN')" class="px-2.5 py-1 rounded bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 border border-purple-500/30 font-medium transition">
        ⚡ Admin
      </button>
      <button onclick="window.quickLogout()" class="px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white transition">
        Log Out
      </button>
    </div>
  </div>

  <!-- Navbar -->
  <header id="navbar-container" class="sticky top-0 z-40 w-full"></header>

  <!-- Main View Container -->
  <main id="app" class="flex-grow w-full flex flex-col"></main>

  <!-- Footer -->
  <footer id="footer-container" class="w-full mt-auto"></footer>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>

  <!-- Main Application Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
